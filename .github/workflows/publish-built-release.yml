name: Publish verified Linux and Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag (for example v0.3.3)
        required: true
        type: string
      build_run_id:
        description: Build desktop executables run containing successful Linux and Windows jobs
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify artifact provenance and platform checks
        shell: bash
        run: |
          timeout 30s gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/build-run.json
          test "$(jq -r '.path' /tmp/build-run.json)" = '.github/workflows/build-desktop.yml'
          test "$(jq -r '.head_sha' /tmp/build-run.json)" = "$(git rev-parse HEAD)"
          timeout 30s gh run view "$BUILD_RUN_ID" --json jobs > /tmp/jobs.json
          jq -e '[.jobs[] | select(.name == "Linux x64" or .name == "Windows x64")] | length == 2 and all(.conclusion == "success")' /tmp/jobs.json

      - name: Download Linux packages
        run: timeout 40s gh run download "$BUILD_RUN_ID" --name pigeon-linux-x64 --dir packages/linux

      - name: Download Windows packages
        run: timeout 40s gh run download "$BUILD_RUN_ID" --name pigeon-windows-x64 --dir packages/windows

      - name: Stage distributable files only
        shell: bash
        run: |
          mkdir -p release
          for file in packages/linux/* packages/windows/*; do
            name="$(basename "$file")"
            case "$name" in
              *.AppImage|*.deb|*.exe|*.zip|*.blockmap|latest*.yml)
                test ! -e "release/$name"
                cp "$file" "release/$name"
                ;;
            esac
          done
          test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name '*.exe' -print -quit)"

      - name: Checksum and publish
        shell: bash
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%f\0' | sort -z | xargs -0 sha256sum > "SHA256SUMS-${RELEASE_TAG#v}.txt"
          timeout 30s gh release view "$RELEASE_TAG" >/dev/null 2>&1 || timeout 30s gh release create "$RELEASE_TAG" --verify-tag --draft --title "Pigeon ${RELEASE_TAG#v}" --generate-notes
          for file in ./*; do
            asset_name="$(basename "$file")"
            if ASSET_NAME="$asset_name" timeout 30s gh release view "$RELEASE_TAG" --json assets --jq 'any(.assets[]; .name == env.ASSET_NAME)' | grep -qx true; then
              continue
            fi
            uploaded=false
            for attempt in 1 2 3; do
              if timeout 600s gh release upload "$RELEASE_TAG" "$file" --clobber; then
                uploaded=true
                break
              fi
              timeout 30s gh release delete-asset "$RELEASE_TAG" "$asset_name" --yes || true
              sleep "$((attempt * 2))"
            done
            "$uploaded"
          done
          timeout 30s gh release edit "$RELEASE_TAG" --draft=false --latest
