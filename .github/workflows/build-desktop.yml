name: Build desktop executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            command: npm run dist:win
            artifact: pigeon-windows-x64
          - name: macOS universal
            os: macos-14
            command: npm run dist:mac
            artifact: pigeon-macos-universal
          - name: Linux x64
            os: ubuntu-latest
            command: npm run dist:linux
            artifact: pigeon-linux-x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MACOS_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}

      - name: Verify macOS update signature
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          APP_PATH="release/mac-universal/Pigeon.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIGNING_DETAILS="$(codesign -dv --verbose=4 "$APP_PATH" 2>&1)"
          printf '%s\n' "$SIGNING_DETAILS"
          grep -q '^Authority=Developer ID Application:' <<<"$SIGNING_DETAILS" || {
            echo 'The macOS release must use a Developer ID Application certificate so Squirrel can validate automatic updates.' >&2
            exit 1
          }
          grep -Eq '^TeamIdentifier=.+$' <<<"$SIGNING_DETAILS" || {
            echo 'The macOS release has no signing team identifier.' >&2
            exit 1
          }

      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish update artifacts
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages and update metadata
        uses: actions/download-artifact@v4
        with:
          pattern: pigeon-*
          path: release
          merge-multiple: true

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
