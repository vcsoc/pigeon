<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}body{width:300px;margin:0;background:#202225;color:#f1f2f4;font:13px Inter,system-ui,-apple-system,sans-serif}.header{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid #3c4045}.header img{width:28px;height:28px}.header strong{font-size:15px}.body{padding:15px 16px}.destination{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid #474c52;border-radius:8px;background:#292c30}.folder{font-size:22px;color:#d5d9df}.destination small{display:block;color:#969ca4;margin-top:2px}.tip{color:#afb4bb;line-height:1.5;margin:13px 1px}.actions{display:grid;gap:8px}button{width:100%;height:36px;border:1px solid #555b63;border-radius:7px;background:#35393e;color:#fff;font:600 12px system-ui;cursor:pointer}button:hover{background:#40454b}.status{min-height:18px;margin-top:10px;color:#aeb4bc;font-size:11px}.version{color:#737981;font-size:10px;text-align:center;padding:0 0 12px}
  </style>
</head>
<body>
  <header class="header"><img src="icons/icon-32.png" alt=""><strong id="extension-name">Pigeon</strong></header>
  <main class="body">
    <div class="destination"><span class="folder">▱</span><div><strong>Downloads</strong><small>Temporary Pigeon collection</small></div></div>
    <p class="tip">Drag an image or video on any website. Drop it into the Pigeon panel that appears to save it locally.</p>
    <div class="actions"><button id="image">Save largest image on this page</button><button id="page">Save current page URL</button></div>
    <div id="status" class="status" aria-live="polite"></div>
  </main>
  <div class="version">Pigeon extension 2.0.2</div>
  <script src="popup.js"></script>
</body>
</html>
